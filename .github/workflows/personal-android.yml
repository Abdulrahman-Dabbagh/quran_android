name: Personal Quran Android
on:
  push:
    branches: [personal-android]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew :app:assembleMadaniDebug -PdisableFirebase --no-daemon
      - name: Save installable APK
        uses: actions/upload-artifact@v7
        with:
          name: personal-quran-debug-${{ github.sha }}
          path: app/build/outputs/apk/madani/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Lint and tests
        run: ./gradlew :app:lintMadaniDebug testMadaniDebug testReleaseUnitTest verifySqlDelightMigration -PdisableFirebase --no-daemon
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
